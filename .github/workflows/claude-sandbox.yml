name: Claude sandbox image

# Independent of the WebUI release: a new image is published only when
# examples/claude-sandbox/ (or this workflow) changes on main. Run it by hand to
# rebuild with the newest Claude Code release.
on:
  push:
    branches: [main]
    paths:
      - examples/claude-sandbox/**
      - .github/workflows/claude-sandbox.yml
  pull_request:
    paths:
      - examples/claude-sandbox/**
      - .github/workflows/claude-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-sandbox

jobs:
  # Nothing is compiled, so building arm64 under QEMU is fast enough.
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: examples/claude-sandbox
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
      - if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect "$IMAGE:latest"
