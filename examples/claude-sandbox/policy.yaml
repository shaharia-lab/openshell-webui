version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  claude_anthropic:
    name: claude_anthropic
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
      - { host: statsig.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: read-write }
    binaries:
      - { path: /usr/local/bin/claude }
